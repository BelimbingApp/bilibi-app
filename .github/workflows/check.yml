name: Check setup
on:
  pull_request:
  push:
    branches: [main, 'fm/**']
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
    secrets:
      SOURCE_READ_TOKEN:
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.0-bookworm@sha256:3f55f8895c4ed50603e2fbdfc72fffeeaba3173321fee5cb825bbbeb30d9d854
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: setup_check
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/setup_check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test publisher helpers
        run: python3 -m unittest discover -s tests
      - name: Materialize exact sources
        env:
          # Pull requests, including same-repository requests, receive no source secret.
          SOURCE_READ_TOKEN: ${{ github.event_name != 'pull_request' && secrets.SOURCE_READ_TOKEN || '' }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          helper="$RUNNER_TEMP/setup-askpass"
          cat > "$helper" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$SOURCE_READ_TOKEN" ;;
          esac
          SH
          chmod 700 "$helper"
          trap 'rm -f "$helper"' EXIT
          GIT_ASKPASS="$helper" python3 scripts/recipe.py materialize
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/cargo/registry
            build/cargo/git
            build/target
          key: linux-x86_64-${{ hashFiles('setup.toml', 'composition/*', 'rust-toolchain.toml', 'builder.toml', 'scripts/Builder.Dockerfile') }}
      - name: Restore and check the whole setup
        run: |
          mkdir -p build/evidence
          /usr/bin/time -p scripts/builder.sh scripts/check.sh 2> >(tee build/evidence/check-time.txt >&2)
      - name: Measure a warm locked build
        run: |
          /usr/bin/time -p scripts/builder.sh bash -c 'cd build/platform; cargo build --workspace --release --target x86_64-unknown-linux-gnu --locked' 2> >(tee build/evidence/warm-time.txt >&2)
      - name: Package checked bytes
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          scripts/builder.sh python3 scripts/package.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
          scripts/builder.sh python3 scripts/verify-package.py --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: inputs.release_tag != ''
        with:
          name: setup-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: build-times
          path: build/evidence/*
          if-no-files-found: warn
